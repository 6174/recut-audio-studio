# Platform-owned virtual environment requirements for 声音工坊.
# ASR via faster-whisper; TTS via CosyVoice2 whose flow/hifigan use the matcha
# modules vendored as the CosyVoice third_party/Matcha-TTS git submodule (cloned
# by bootstrap.sh, never pip-installed). openai-whisper and modelscope are
# intentionally absent: the runner injects a whisper shim (log_mel_spectrogram +
# whisper.tokenizer.Tokenizer over vendored mel filters) and a modelscope shim
# (snapshot_download), so nothing builds from source at install time.
