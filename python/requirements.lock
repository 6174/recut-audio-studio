# [INPUT]: 由 manifest.json 的 runtime.python 读取并作为 venv 指纹的一部分。
# [OUTPUT]: 为 Whisper、Qwen3-ASR、CosyVoice2 与可选 ModelScope 下载提供可运行的 Python 依赖。
# [POS]: audio-studio 的平台拥有依赖契约；权重文件存在不等于对应运行时依赖已安装。
# [PROTOCOL]: 变更时更新此头部，然后检查 README.md
#
# Platform-owned virtual environment requirements for 声音工坊.
# Versions are intentionally unpinned so the platform's python3 (macOS may be
# 3.11, 3.12, 3.13 or 3.14) resolves wheels compatible with itself; this mirrors
# depth-anything. ASR via faster-whisper; TTS via CosyVoice2 whose flow/hifigan
# use the Matcha-TTS modules prepared by bootstrap.py under CosyVoice's
# third_party directory (never pip-installed). openai-whisper and
# modelscope are intentionally absent: the runner injects a whisper shim
# (log_mel_spectrogram + whisper.tokenizer.Tokenizer over vendored mel filters)
# and a modelscope shim (snapshot_download), so nothing builds from source.
torch
torchaudio
numpy
faster-whisper
qwen-asr
huggingface-hub
modelscope
